<html><head><base href="https://rachezprograms.online/"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" sizes="192x192" href="https://i.imgur.com/a09yuOo.png" type="image/x-icon"><link rel="shortcut icon" href="https://i.imgur.com/a09yuOo.png" type="image/x-icon"><link rel="apple-touch-icon" href="https://i.imgur.com/a09yuOo.png" type="image/x-icon"><title>Programas</title><style>body{font-family:Arial,sans-serif;background-color:#1a1a1a;color:#e0e0e0;margin:0;padding:0;display:flex;min-height:100vh}header{background-color:#2a2a2a;width:200px;height:100vh;position:fixed;right:0;top:0;display:flex;flex-direction:column;justify-content:space-between}nav{flex-grow:1;display:flex;flex-direction:column;gap:20px;padding:20px}nav a{color:#fff;text-decoration:none;font-size:18px;padding:10px;border-radius:5px;transition:background-color .3s}nav a.active,nav a:hover{background-color:#3a3a3a}main{margin-right:200px;padding:20px;flex-grow:1}h1{color:#fff;text-align:center;margin:20px 0}.content-container{background-color:#2a2a2a;border-radius:10px;box-shadow:0 0 10px rgba(255,255,255,.1);padding:20px;width:300px;max-height:400px;overflow-y:auto;margin:0 auto}.item-list{list-style-type:none;padding:0;margin:0}.item{padding:10px;border-bottom:1px solid #3a3a3a;cursor:pointer;transition:background-color .3s;display:flex;justify-content:space-between;align-items:center}.item:last-child{border-bottom:none}.item:hover{background-color:#3a3a3a}.item-info{display:flex;flex-direction:column;flex-grow:1}.item-name{font-weight:700;color:#fff}.info-icon{font-size:1.2em;color:#4CAF50;cursor:pointer;margin-left:10px}.modal{display:none;position:fixed;z-index:1;left:0;top:0;width:100%;height:100%;overflow:auto;background-color:rgba(0,0,0,.7)}.modal-content{background-color:#2a2a2a;margin:10% auto;padding:20px;border:1px solid #444;width:80%;max-width:600px;border-radius:5px;text-align:center;color:#e0e0e0}.close{color:#aaa;float:right;font-size:28px;font-weight:700;cursor:pointer}.close:focus,.close:hover{color:#fff;text-decoration:none;cursor:pointer}.button{display:inline-block;padding:10px 20px;margin:10px;background-color:#4CAF50;color:#fff;text-decoration:none;border-radius:5px;transition:background-color .3s}.button:hover{background-color:#45a049}.content-container::-webkit-scrollbar{width:10px}.content-container::-webkit-scrollbar-track{background:#2a2a2a;border-radius:10px}.content-container::-webkit-scrollbar-thumb{background:#555;border-radius:10px}.content-container::-webkit-scrollbar-thumb:hover{background:#777}.button-container{display:flex;flex-wrap:wrap;justify-content:center}.search-container{margin-bottom:15px;width:300px;margin:0 auto 20px auto}.search-input{width:100%;padding:10px;border:none;border-radius:5px;background-color:#3a3a3a;color:#e0e0e0;font-size:16px}.search-input:focus{outline:0;box-shadow:0 0 5px rgba(76,175,80,.5)}.social-icons{position:fixed;bottom:20px;left:20px;display:flex;gap:15px}.social-icon{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:#e0e0e0;transition:color .3s,transform .3s}.social-icon:hover{color:#4CAF50;transform:scale(1.1)}.social-icon svg{width:100%;height:100%}</style></head><body><header><nav><a href="#programas" class="active" onclick="showContent(&quot;programas&quot;)">Programas</a> <a href="#sistemas" onclick="showContent(&quot;sistemas&quot;)">Sistema</a></nav></header><main><h1>Programas</h1><div id="programas-search" class="search-container"><input class="search-input" placeholder="Buscar programas..." onkeyup="searchItems(&quot;programas&quot;)"></div><div id="programas" class="content-container"><ul class="item-list"><li class="item" data-button1="Descargar" data-link1="https://www.mediafire.com/file/4jlbotzas4ldl4s/Double_Driver.zip/file" data-info="Double Driver es una herramienta para respaldar y restaurar controladores en Windows, simplificando la gestión y recuperación de drivers esenciales."><div class="item-info"><span class="item-name">Double Driver</span></div><span class="info-icon">?</span></li><li class="item" data-button1="Descargar" data-link1="https://huggingface.co/spaces/rachez/Programs/resolve/main/Spotify%20PC%20noads.zip" data-info="Estos son scripts creados por Spicetify que he automatizado para integrar el marketplace en Spotify y desactivar los anuncios."><div class="item-info"><span class="item-name">Spotify Noads</span></div><span class="info-icon">?</span></li></ul></div><div id="sistemas-search" class="search-container" style="display:none"><input class="search-input" placeholder="Buscar sistemas..." onkeyup="searchItems(&quot;sistemas&quot;)"></div><div id="sistemas" class="content-container" style="display:none"><ul class="item-list"><li class="item" data-button1="Descargar" data-link1="https://www.mediafire.com/file/tph9yn4rz2i6u9t/MiniOS10_LTSC-1809_v2023.01_x86.iso/file" data-info="Este es un Windows 10 optimizado para EXO, basado en MiniOS10 LTSC 1089 2023 para 32 bits, ofreciendo un rendimiento eficiente y ágil."><div class="item-info"><span class="item-name">Windows 10 exo</span></div><span class="info-icon">?</span></li></ul></div><div id="modal" class="modal"><div class="modal-content"><span class="close">&times;</span><h2 id="modal-title"></h2><p id="modal-info"></p><div class="button-container" id="button-container"></div></div></div><div class="social-icons"><a href="http://discord.rachezprograms.online/" target="_blank" class="social-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/></svg></a> <a href="https://www.youtube.com/@Rachezprograms" target="_blank" class="social-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg></a></div></main><script>document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modal-title');
            const modalInfo = document.getElementById('modal-info');
            const buttonContainer = document.getElementById('button-container');
            const closeButton = document.getElementsByClassName('close')[0];
            const items = document.querySelectorAll('.item');

            function setupItemListeners(items) {
                items.forEach(item => {
                    const infoIcon = item.querySelector('.info-icon');

                    infoIcon.addEventListener('click', (event) => {
                        event.stopPropagation();
                        const itemName = item.querySelector('.item-name').textContent;
                        const info = item.dataset.info;

                        modalTitle.textContent = itemName;
                        modalInfo.textContent = info;
                        buttonContainer.style.display = 'none';
                        modal.style.display = 'block';
                    });

                    item.addEventListener('click', (event) => {
                        if (event.target !== infoIcon) {
                            const itemName = item.querySelector('.item-name').textContent;

                            modalTitle.textContent = itemName;
                            modalInfo.textContent = '';
                            buttonContainer.innerHTML = ''; // Clear previous buttons
                            buttonContainer.style.display = 'flex';

                            // Create buttons dynamically
                            for (let i = 1; i <= 5; i++) {
                                const buttonText = item.dataset[`button${i}`];
                                const buttonLink = item.dataset[`link${i}`];

                                if (buttonText && buttonLink) {
                                    const button = document.createElement('a');
                                    button.href = buttonLink;
                                    button.className = 'button';
                                    button.textContent = buttonText;
                                    button.target = '_blank';
                                    buttonContainer.appendChild(button);
                                }
                            }

                            modal.style.display = 'block';
                        }
                    });
                });
            }

            setupItemListeners(items);

            closeButton.onclick = () => {
                modal.style.display = 'none';
            };

            window.onclick = (event) => {
                if (event.target == modal) {
                    modal.style.display = 'none';
                }
            };

            // Sort items alphabetically
            const sortItems = (containerId) => {
                const container = document.getElementById(containerId);
                const itemList = container.querySelector('.item-list');
                const items = Array.from(itemList.getElementsByClassName('item'));

                items.sort((a, b) => {
                    const nameA = a.querySelector('.item-name').textContent.toUpperCase();
                    const nameB = b.querySelector('.item-name').textContent.toUpperCase();
                    return nameA.localeCompare(nameB);
                });

                items.forEach(item => itemList.appendChild(item));
            };

            sortItems('programas');
            sortItems('sistemas');
        });

        function showContent(contentId) {
            const programas = document.getElementById('programas');
            const sistemas = document.getElementById('sistemas');
            const programasSearch = document.getElementById('programas-search');
            const sistemasSearch = document.getElementById('sistemas-search');
            const navLinks = document.querySelectorAll('nav a');
            const title = document.querySelector('h1');

            programas.style.display = 'none';
            sistemas.style.display = 'none';
            programasSearch.style.display = 'none';
            sistemasSearch.style.display = 'none';

            if (contentId === 'programas') {
                programas.style.display = 'block';
                programasSearch.style.display = 'block';
                title.textContent = 'Programas';
            } else if (contentId === 'sistemas') {
                sistemas.style.display = 'block';
                sistemasSearch.style.display = 'block';
                title.textContent = 'Sistemas';
            }

            navLinks.forEach(link => {
                if (link.getAttribute('href') === `#${contentId}`) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }

        function searchItems(contentId) {
            const input = document.querySelector(`#${contentId}-search .search-input`);
            const filter = input.value.toUpperCase();
            const items = document.querySelectorAll(`#${contentId} .item`);

            items.forEach(item => {
                const itemName = item.querySelector('.item-name').textContent;
                if (itemName.toUpperCase().indexOf(filter) > -1) {
                    item.style.display = "";
                } else {
                    item.style.display = "none";
                }
            });
        }</script></body></html>
